<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sena JG — Livros</title>
  <meta name="description" content="Livros de Sena JG: O Cristo Cósmico e Como A Realidade Funciona.">
  <link rel="canonical" href="https://senajg.com.br/">

  <meta name="theme-color" content="#06061a">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Sena JG">
  <meta property="og:title" content="Sena JG — Livros">
  <meta property="og:description" content="Livros de Sena JG: O Cristo Cósmico e Como A Realidade Funciona.">
  <meta property="og:url" content="https://senajg.com.br/">
  <meta property="og:image" content="https://senajg.com.br/assets/cristo-frente.jpg">
  <meta property="og:image:width" content="413">
  <meta property="og:image:height" content="623">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "Sena JG",
        "url": "https://senajg.com.br/",
        "inLanguage": "pt-BR"
      },
      {
        "@type": "Person",
        "name": "Sena JG",
        "url": "https://senajg.com.br/"
      },
      {
        "@type": "ItemList",
        "name": "Livros",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "url": "https://senajg.com.br/cristo-cosmico-rebuild/", "name": "O Cristo Cósmico" },
          { "@type": "ListItem", "position": 2, "url": "https://senajg.com.br/universos.paralelos/", "name": "Como A Realidade Funciona" }
        ]
      }
    ]
  }
  </script>

  <style>
    :root {
      --fundo: #06061a;
      --texto: #eef1f8;
      --texto-suave: #c4cbe0;
      --ouro: #f1c03b;
      --terracota-btn: #a9502a;
      --ciano: #4fd1e8;
      --fonte-display: "Audiowide", "Trebuchet MS", system-ui, sans-serif;
      --fonte-texto: Arial, Helvetica, "Liberation Sans", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--texto);
      background-color: var(--fundo);
      /* Um brilho de cada livro: turquesa (O Cristo Cósmico) e vermelho-violeta (Universos Paralelos) */
      background-image:
        radial-gradient(ellipse 60% 55% at 15% 10%, rgba(36, 161, 156, 0.30), transparent 70%),
        radial-gradient(ellipse 60% 55% at 85% 15%, rgba(200, 0, 90, 0.28), transparent 70%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(0, 0, 130, 0.45), transparent 70%);
      background-attachment: fixed;
      font-family: var(--fonte-texto);
      line-height: 1.5;
    }

    img { max-width: 100%; height: auto; }

    a:focus-visible { outline: 3px solid var(--ouro); outline-offset: 4px; }

    .pagina {
      max-width: 60rem;
      margin: 0 auto;
      padding: 2rem 1rem 2.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: var(--fonte-display);
      font-weight: 400;
      font-size: clamp(2.5rem, 9vw, 4rem);
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 0 26px rgba(79, 209, 232, 0.45), 0 2px 0 var(--fundo);
    }

    h2 {
      margin: 0.5rem 0 2rem;
      font-weight: 400;
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ouro);
    }

    .livros {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 2.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .livro {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .livro a.capa { display: block; }

    .livro img {
      display: block;
      width: auto;
      height: 300px;
      border-radius: 4px;
      box-shadow: 0 20px 44px -14px rgba(0, 0, 0, 0.75);
      transition: transform 0.2s ease;
    }
    .livro a.capa:hover img { transform: translateY(-3px); }

    h3 {
      margin: 1.25rem 0 0.25rem;
      font-size: 1.3rem;
      line-height: 1.25;
    }

    .autor { margin: 0 0 1rem; color: var(--texto-suave); }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-cristo { background: var(--terracota-btn); color: #fff; }
    .btn-universos { background: #ffe600; color: #1a0050; }

    @media (prefers-reduced-motion: reduce) {
      .btn, .livro img { transition: none; }
      .btn:hover, .livro a.capa:hover img { transform: none; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <h1>Sena JG</h1>
    <h2>Livros</h2>

    <ul class="livros">
      <li class="livro">
        <a class="capa" href="/cristo-cosmico-rebuild/" tabindex="-1" aria-hidden="true">
          <picture>
            <source type="image/webp" srcset="/assets/cristo-frente.webp">
            <img src="/assets/cristo-frente.jpg" width="413" height="623" alt="">
          </picture>
        </a>
        <h3>O Cristo Cósmico</h3>
        <p class="autor">Autor: Sena JG</p>
        <a class="btn btn-cristo" href="/cristo-cosmico-rebuild/">Conheça o livro</a>
      </li>

      <li class="livro">
        <a class="capa" href="/universos.paralelos/" tabindex="-1" aria-hidden="true">
          <picture>
            <source type="image/webp" srcset="/assets/universos-frente.webp">
            <img src="/assets/universos-frente.jpg" width="268" height="402" alt="">
          </picture>
        </a>
        <h3>Como A Realidade Funciona</h3>
        <p class="autor">Autor: JGS</p>
        <a class="btn btn-universos" href="/universos.paralelos/">Conheça o livro</a>
      </li>
    </ul>
  </main>
</body>
</html>
