  <style>
    :root {
      --fundo: #06061a; --texto: #eef1f8; --texto-suave: #c4cbe0; --ouro: #f1c03b;
      --fonte-display: "Audiowide", "Trebuchet MS", system-ui, sans-serif;
      --fonte-texto: Arial, Helvetica, "Liberation Sans", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; color: var(--texto); background-color: var(--fundo);
      background-image:

      background-attachment: fixed; font-family: var(--fonte-texto); line-height: 1.5;
    }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    img { max-width: 100%; height: auto; }
    a:focus-visible { outline: 3px solid var(--ouro); outline-offset: 4px; }

    .barra { display: flex; justify-content: flex-end; max-width: 72rem; margin: 0 auto; padding: 0.9rem 1.25rem 0; }
    .idiomas { display: flex; gap: 0.4rem; }
    .idiomas a { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.75rem; border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 999px; background: rgba(255, 255, 255, 0.06); color: var(--texto); font-size: 0.9rem; text-decoration: none; }
    .idiomas a[aria-current="page"] { background: #fff; border-color: #fff; color: #10123a; font-weight: 700; }
    .bandeira { width: 21px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25); }

    .pagina { max-width: 72rem; margin: 0 auto; padding: 0.75rem 1rem 2.5rem; text-align: center; }
    h1 { margin: 0; font-family: var(--fonte-display); font-weight: 400; font-size: clamp(2.5rem, 9vw, 4rem); line-height: 1.1; color: #fff; text-shadow: 0 0 26px rgba(79, 209, 232, 0.45), 0 2px 0 var(--fundo); }
    .sub { margin: 0.5rem 0 1.75rem; font-size: 1.1rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ouro); }

    .secao { margin: 0 0 2.5rem; }
    .secao-titulo { margin: 0 0 0.3rem; font-size: 0.95rem; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; color: var(--texto-suave); }
    .serie { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 0 0 1.5rem; font-size: 1.5rem; font-weight: 700; }
    .serie::before, .serie::after { content: ""; flex: 0 1 8rem; height: 1px; background: linear-gradient(90deg, transparent, var(--ouro), transparent); }
    .serie a { color: #fff; text-decoration: none; }
    .serie a:hover { text-decoration: underline; text-underline-offset: 4px; }

    .livros { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 2rem 1.5rem; margin: 0 auto; padding: 0; list-style: none; }
    .livros.n2 { max-width: 34rem; } .livros.n3 { max-width: 52rem; }
    .livro { display: flex; flex-direction: column; align-items: center; }
    .livro a.capa { display: block; }
    .livro img { display: block; width: auto; height: 248px; border-radius: 4px; box-shadow: 0 20px 44px -14px rgba(0, 0, 0, 0.75); transition: transform 0.2s ease; }
    /* com o mouse em qualquer ponto do card (a capa, o título, o botão), ou com o foco do teclado num link dele, a capa
       sobe um pouco (regras separadas: o navegador que não conhece :has fica só com a do mouse) */
    .livro:hover a.capa img { transform: translateY(-3px); }
    .livro:has(:focus-visible) a.capa img { transform: translateY(-3px); }
    h3 { margin: 1rem 0 0.2rem; font-size: 1.12rem; line-height: 1.25; }
    /* o título de cada livro é link para a página dele: sublinhado; com o mouse em qualquer ponto do card, ou com o foco
       do teclado num link dele, fica dourado e com o sublinhado mais grosso, como com o mouse em cima do título (regras
       separadas: o navegador que não conhece :has fica só com a do mouse) */
    .livro h3 a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .livro:hover h3 a { color: var(--ouro); text-decoration-thickness: 2px; }
    .livro:has(:focus-visible) h3 a { color: var(--ouro); text-decoration-thickness: 2px; }
    /* quando a capa sobe, ela é pintada por cima do que não tem posição: o título, o autor e a etiqueta ganham posição,
       para ficar por cima da sombra da capa (senão a sombra escurece o título) */
    .livro h3, .livro .autor, .livro .tag { position: relative; }
    .autor { margin: 0 0 0.8rem; color: var(--texto-suave); }
    .tag { display: inline-block; margin: -0.4rem 0 0.7rem; padding: 0.1rem 0.6rem; border: 1px solid rgba(241, 192, 59, 0.6); border-radius: 999px; font-size: 0.78rem; color: var(--ouro); }
    .btn { display: inline-block; padding: 0.6rem 1.2rem; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.85); font-weight: 700; text-decoration: none; transition: transform 0.2s ease; }
    .btn:hover { transform: translateY(-1px); }
    .livro .btn { margin-top: auto; } /* botões na mesma altura, mesmo quando um título quebra em duas linhas */

    .autor-amazon { display: flex; justify-content: center; margin: -0.5rem 0 2.5rem; }
    .chip { display: inline-block; padding: 0.5rem 1.1rem; border: 1px solid rgba(241, 192, 59, 0.7); border-radius: 999px; color: var(--ouro); font-size: 0.95rem; font-weight: 700; text-decoration: none; }
    .chip:hover { background: rgba(241, 192, 59, 0.12); }
    .divisor { max-width: 40rem; margin: 0 auto 2.25rem; border: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent); }
    /* Livros seculares ficam numa página própria, aberta só por este botão */
    .ir-cotidiano { display: flex; justify-content: center; margin: 0 0 1rem; }
    .ir-cotidiano a {
      display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 999px; background: rgba(255, 255, 255, 0.06);
      color: var(--texto); font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;
    }
    .ir-cotidiano a::after { content: "→"; color: var(--ouro); }
    .ir-cotidiano a:hover { background: rgba(255, 255, 255, 0.12); }
    .voltar { display: flex; justify-content: center; margin: 1rem 0 0; }
    h1 a { color: inherit; text-decoration: none; }
    @media (prefers-reduced-motion: reduce) { .btn, .livro img { transition: none; } .btn:hover, .livro:hover a.capa img { transform: none; } }
    @media (prefers-reduced-motion: reduce) { .livro:has(:focus-visible) a.capa img { transform: none; } }
    .voltar .chip { padding-left: 0.6rem; padding-right: 0.6rem; }
    .voltar .seta { width: 1.89em; height: 1.26em; vertical-align: -0.27em; width: 2.625cap; height: 1.75cap; vertical-align: -0.375cap; margin-right: 0.45em; overflow: visible; transform-origin: 50% 50%; }
    .voltar .seta.gira g { filter: none; }
    .marca:hover, .marca:focus-visible { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; border-radius: 6px; background: color-mix(in srgb, currentColor 16%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, currentColor 16%, transparent); }
    .btn-cristo { background: #a9502a; color: #fff; }
    .btn-universos { background: #ffe600; color: #1a0050; }
    .btn-solucao { background: #1a3cb4; color: #fff; }
    .btn-celeiro { background: #1f4f7a; color: #fff; }
    .btn-dinheiro { background: linear-gradient(160deg, #ffe58a, #e0a800); color: #1a1300; }
    .btn-kindle { background: linear-gradient(160deg, #ffe073, #f2a900); color: #141000; }
    .livro > .btn:first-child { margin: 0 0 1.4rem; }
